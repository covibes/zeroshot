name: 'CodeQL Security Analysis'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run at 3 AM UTC every Monday
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.paths.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Node analysis
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]] ||
             [[ -z "$BASE_SHA" ]] ||
             [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            node .github/ci-path-classifier.js < /dev/null | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/ci-path-classifier.js |
            tee -a "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL JavaScript/TypeScript
    needs: classify
    if: needs.classify.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # Disable default queries and use security-extended
          queries: security-extended
          # Scan all JS/TS files
          config: |
            paths:
              - src
              - lib
              - cli
              - task-lib
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - '**/*.test.js'
              - '**/*.test.ts'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

  required:
    name: Analyze JavaScript/TypeScript
    needs: [classify, analyze]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable CodeQL analysis
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NODE_SELECTED: ${{ needs.classify.outputs.node }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::classify concluded with $CLASSIFY_RESULT"
            exit 1
          fi
          if [[ "$NODE_SELECTED" == "true" && "$ANALYZE_RESULT" != "success" ]]; then
            echo "::error::analyze concluded with $ANALYZE_RESULT"
            exit 1
          fi
