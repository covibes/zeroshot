[workspace]
resolver = "2"
members = [
  "crates/openengine-cluster-protocol",
  "crates/openengine-cluster-server",
  "crates/openengine-cluster-client",
  "crates/openengine-cluster-testkit",
  "crates/openengine-cluster-testkit/tests/external-backend-fixture",
  "zeroshot-rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/the-open-engine/zeroshot"

[workspace.dependencies]
async-trait = "0.1.89"
fs2 = "0.4.3"
getrandom = "0.3.4"
httparse = "1.10.1"
libc = "0.2.177"
parking_lot = "0.12.5"
rust_decimal = { version = "1.39.0", features = ["serde"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.26"
url = "2.5.8"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=0.26.8"
rcgen = "=0.13.2"
time = "=0.3.41"
futures-util = "0.3"
jsonschema = { version = "0.29.1", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
windows-sys = "0.61.2"

openengine-cluster-protocol = { path = "crates/openengine-cluster-protocol" }
openengine-cluster-server = { path = "crates/openengine-cluster-server" }
openengine_cluster_client = { package = "openengine-cluster-client", path = "crates/openengine-cluster-client" }
openengine-cluster-client = { path = "crates/openengine-cluster-client" }
openengine-cluster-testkit = { path = "crates/openengine-cluster-testkit" }
